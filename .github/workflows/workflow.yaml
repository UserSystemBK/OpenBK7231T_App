name: Build App
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches: 
      - '**'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  refs:
    name: Prepare CI Environment
    runs-on: ubuntu-22.04
    outputs:
      sha_short: ${{ steps.refs.outputs.sha_short }}
      short_ref: ${{ steps.refs.outputs.short_ref }}
      version: ${{ steps.refs.outputs.version }}
      new_release: ${{ steps.refs.outputs.new_release }}
    steps:
      - name: Source checkout
        uses: actions/checkout@v5
      - name: Semantic Release
        id: semantic
        if: github.ref == 'refs/heads/main' || github.ref_name == 'alpha'
        uses: cycjimmy/semantic-release-action@v5
        with:
          dry_run: true
          semantic_version: 21
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set outputs
        id: refs
        run: |
          export BRANCH=${GITHUB_REF#refs/*/}
          echo "branch: ${BRANCH}"
          export BRANCHTRANSLATED=$(echo ${BRANCH} | tr '/' '_')
          echo "short_ref: ${BRANCHTRANSLATED}"
          export VERSION=""
          if ${{ steps.semantic.outputs.new_release_published == 'true' }}; then
            export VERSION=${{ steps.semantic.outputs.new_release_version }}
          else
            export VERSION=${BRANCHTRANSLATED}_$(git rev-parse --short=12 HEAD)
          fi
          echo "new_release=${{ steps.semantic.outputs.new_release_published }}" >> $GITHUB_OUTPUT
          echo "short_ref=${BRANCHTRANSLATED}" >> $GITHUB_OUTPUT
          echo "sha_short=SHA-$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: refs
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: OpenBK7236
            variant: default
            gcc: 10.3-2021.10
          - platform: OpenBK7239N
            variant: default
            gcc: 10.3-2021.10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Cache arm-none-eabi-gcc
      id: cache-gcc
      uses: actions/cache@v4
      with:
        path: /opt/gcc-arm-none-eabi
        key: ${{ matrix.gcc }}-gcc

    - name: Install arm-none-eabi-gcc
      if: steps.cache-gcc.outputs.cache-hit != 'true' && matrix.gcc != ''
      run: |
        sudo mkdir -p /opt/gcc-arm-none-eabi
        sudo chmod 777 /opt/gcc-arm-none-eabi
        if [ "${{ matrix.gcc }}" = "10.3-2021.10" ]; then
          wget -qO- https://arm.com | tar -xjC /opt/gcc-arm-none-eabi --strip-components=1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install platformio
      run: |
        pip install scons
        pip install platformio

    - name: Run Build Script
      run: |
        if [ "${{ matrix.gcc }}" != "" ]; then
          export PATH=$PATH:/opt/gcc-arm-none-eabi/bin
        fi
        python build_scripts/build.py --platform ${{ matrix.platform }} --variant ${{ matrix.variant }} --version ${{ needs.refs.outputs.version }}

    - name: Upload build assets
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.APP_NAME }}_${{ needs.refs.outputs.version }}
        path: output/${{ needs.refs.outputs.version }}
